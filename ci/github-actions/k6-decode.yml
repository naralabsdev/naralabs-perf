# Copy to .github/workflows/k6-decode.yml after cloning (GitHub requires workflow scope to push via API).
name: k6 decode benchmark

on:
  workflow_dispatch:
    inputs:
      target:
        description: BASE_URL (Atlas API)
        required: true
        default: https://atlas.naralabs.io

jobs:
  k6-p95:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run p95 benchmark
        env:
          API_KEY: ${{ secrets.NARALABS_API_KEY }}
          BASE_URL: ${{ inputs.target }}
          VUS: "5"
          DURATION: 30s
        run: ./scripts/run-decode-p95.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports
          path: reports/
